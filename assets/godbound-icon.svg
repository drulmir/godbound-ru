<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2b2347"/>
      <stop offset="50%" stop-color="#181328"/>
      <stop offset="100%" stop-color="#0b0918"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f5c452" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c98a2b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c98a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#f0c75e"/>
      <stop offset="100%" stop-color="#b97e24"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="46" fill="url(#sky)"/>
  <rect x="10" y="10" width="492" height="492" rx="38" fill="none"
        stroke="#a8842f" stroke-width="3" opacity="0.6"/>

  <g fill="#e9e2ff">
    <circle cx="80" cy="90" r="1.8" opacity="0.7"/>
    <circle cx="430" cy="70" r="1.5" opacity="0.6"/>
    <circle cx="60" cy="400" r="1.5" opacity="0.5"/>
    <circle cx="450" cy="430" r="1.8" opacity="0.7"/>
    <circle cx="130" cy="440" r="1.2" opacity="0.5"/>
    <circle cx="400" cy="150" r="1.2" opacity="0.5"/>
    <circle cx="110" cy="170" r="1.2" opacity="0.5"/>
  </g>

  <g transform="translate(256,256)">
    <circle r="200" fill="url(#glow)"/>

    <g fill="url(#gold)">
      <g id="ray">
        <path d="M0,-198 L16,-80 L0,-62 L-16,-80 Z"/>
      </g>
      <use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(315)"/>
    </g>
    <g fill="#d9a63c" opacity="0.85">
      <g id="ray2">
        <path d="M0,-138 L9,-78 L0,-64 L-9,-78 Z"/>
      </g>
      <use href="#ray2" transform="rotate(22.5)"/>
      <use href="#ray2" transform="rotate(45)"/>
      <use href="#ray2" transform="rotate(67.5)"/>
      <use href="#ray2" transform="rotate(90)"/>
      <use href="#ray2" transform="rotate(112.5)"/>
      <use href="#ray2" transform="rotate(135)"/>
      <use href="#ray2" transform="rotate(157.5)"/>
      <use href="#ray2" transform="rotate(180)"/>
      <use href="#ray2" transform="rotate(202.5)"/>
      <use href="#ray2" transform="rotate(225)"/>
      <use href="#ray2" transform="rotate(247.5)"/>
      <use href="#ray2" transform="rotate(270)"/>
      <use href="#ray2" transform="rotate(292.5)"/>
      <use href="#ray2" transform="rotate(315)"/>
      <use href="#ray2" transform="rotate(337.5)"/>
    </g>

    <circle r="60" fill="#100c1f" stroke="url(#gold)" stroke-width="7"/>
    <circle r="47" fill="none" stroke="#e7b84f" stroke-width="1.5" opacity="0.7"/>
    <circle r="18" fill="url(#gold)" filter="url(#soft)"/>
    <circle r="11" fill="#fff6d8"/>
  </g>
</svg>
