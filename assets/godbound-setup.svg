<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="sky" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#2b2347"/>
      <stop offset="45%" stop-color="#1a1530"/>
      <stop offset="100%" stop-color="#0b0918"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f5c452" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#c98a2b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c98a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#f0c75e"/>
      <stop offset="100%" stop-color="#b97e24"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdf0c0"/>
      <stop offset="55%" stop-color="#eec25a"/>
      <stop offset="100%" stop-color="#a86f1e"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e9e2ff">
    <circle cx="120" cy="90" r="1.8" opacity="0.8"/>
    <circle cx="230" cy="210" r="1.2" opacity="0.5"/>
    <circle cx="90" cy="360" r="1.5" opacity="0.6"/>
    <circle cx="310" cy="80" r="1.1" opacity="0.5"/>
    <circle cx="180" cy="480" r="1.6" opacity="0.55"/>
    <circle cx="360" cy="330" r="1.1" opacity="0.4"/>
    <circle cx="1080" cy="110" r="1.8" opacity="0.8"/>
    <circle cx="980" cy="240" r="1.2" opacity="0.5"/>
    <circle cx="1120" cy="380" r="1.5" opacity="0.6"/>
    <circle cx="880" cy="90" r="1.2" opacity="0.5"/>
    <circle cx="1020" cy="500" r="1.6" opacity="0.55"/>
    <circle cx="860" cy="410" r="1.1" opacity="0.4"/>
    <circle cx="430" cy="140" r="1.3" opacity="0.5"/>
    <circle cx="760" cy="150" r="1.3" opacity="0.5"/>
  </g>

  <!-- divine halo -->
  <g transform="translate(600,240)">
    <circle r="190" fill="url(#glow)"/>

    <!-- long rays (8-pointed star of the Words) -->
    <g fill="url(#gold)">
      <g id="ray">
        <path d="M0,-186 L14,-74 L0,-58 L-14,-74 Z"/>
      </g>
      <use href="#ray" transform="rotate(45)"/>
      <use href="#ray" transform="rotate(90)"/>
      <use href="#ray" transform="rotate(135)"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(225)"/>
      <use href="#ray" transform="rotate(270)"/>
      <use href="#ray" transform="rotate(315)"/>
    </g>
    <!-- short rays between -->
    <g fill="#d9a63c" opacity="0.85">
      <g id="ray2">
        <path d="M0,-128 L8,-72 L0,-60 L-8,-72 Z"/>
      </g>
      <use href="#ray2" transform="rotate(22.5)"/>
      <use href="#ray2" transform="rotate(45)"/>
      <use href="#ray2" transform="rotate(67.5)"/>
      <use href="#ray2" transform="rotate(90)"/>
      <use href="#ray2" transform="rotate(112.5)"/>
      <use href="#ray2" transform="rotate(135)"/>
      <use href="#ray2" transform="rotate(157.5)"/>
      <use href="#ray2" transform="rotate(180)"/>
      <use href="#ray2" transform="rotate(202.5)"/>
      <use href="#ray2" transform="rotate(225)"/>
      <use href="#ray2" transform="rotate(247.5)"/>
      <use href="#ray2" transform="rotate(270)"/>
      <use href="#ray2" transform="rotate(292.5)"/>
      <use href="#ray2" transform="rotate(315)"/>
      <use href="#ray2" transform="rotate(337.5)"/>
    </g>

    <!-- rings -->
    <circle r="56" fill="#100c1f" stroke="url(#gold)" stroke-width="6"/>
    <circle r="44" fill="none" stroke="#e7b84f" stroke-width="1.5" opacity="0.7"/>

    <!-- inner eye of divinity -->
    <circle r="16" fill="url(#gold)" filter="url(#soft)"/>
    <circle r="10" fill="#fff6d8"/>
  </g>

  <!-- title -->
  <text x="600" y="512" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="96"
        font-weight="bold" letter-spacing="14" fill="url(#goldText)"
        stroke="#5a3c0d" stroke-width="1.5">GODBOUND</text>
  <text x="600" y="566" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="28"
        letter-spacing="10" fill="#c9b98a" opacity="0.85">СМЕРТНЫЕ, СТАВШИЕ БОГАМИ</text>

  <!-- thin frame -->
  <rect x="14" y="14" width="1172" height="602" fill="none"
        stroke="#a8842f" stroke-width="2" opacity="0.55"/>
  <rect x="22" y="22" width="1156" height="586" fill="none"
        stroke="#a8842f" stroke-width="1" opacity="0.3"/>
</svg>
