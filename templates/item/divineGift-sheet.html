<form class="{{cssClass}}" autocomplete="off">
    {{!-- Sheet Body --}}
    <section class="sheet-body">
        <div class="tab attrs active" data-group="primary" data-tab="attrs">
            <div class="container col">
                <h2>Дар</h2>
                <div class="container row sheet-header">
                    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}" height="100"
                         width="100"/>
                    <div class="header-fields tabular">
                        <div>
                            <label for="name">Имя:</label>
                            <input id="name" name="name" type="text" value="{{item.name}}"/>
                        </div>
                        <div>
                            <label for="word">Слово:</label>
                            <select id="word" name="system.word">
                                {{#select system.word}}
                                {{#each actorBoundWordNames as |wordName i|}}
                                    <option value="{{wordName}}">{{wordName}}</option>
                                {{/each}}
                                {{/select}}
                            </select>
                        </div>
                        <div>
                            <label for="description">Описание:</label>
                            <textarea id="description" name="system.description" class="xtall">{{system.description}}</textarea>
                        </div>
                        <div>
                            <label></label>
                            <div style="display:flex; align-items: center">
                                <input type="checkbox" name="system.greater" {{checked system.greater}} style="margin-left:0" />Больший
                                <input type="checkbox" name="system.free" {{checked system.free}} style="margin-left:16px;" title="Не тратит Очки Даров"/>Бесплатно
                            </div>
                        </div>
                        <div>
                            <label>Активация:</label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.constant" {{checked system.constant}} style="margin-left:0" />Постоянно
                                <input type="checkbox" name="system.instant" {{checked system.instant}} />Мгновенно
                                <input type="checkbox" name="system.onTurn" {{checked system.onTurn}} />В свой ход
                                <input type="checkbox" name="system.action" {{checked system.action}} />Действие
                            </div>
                        </div>
                        <div>
                            <label>Усилие:</label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.noEffort" {{checked system.noEffort}} style="margin-left:0" />Нет
                                <input type="checkbox" name="system.atWill" {{checked system.atWill}} />По желанию
                                <input type="checkbox" name="system.scene" {{checked system.scene}} />Сцена
                                <input type="checkbox" name="system.day" {{checked system.day}} />День
                            </div>
                        </div>
                        <div>
                            <label></label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.combatPower" {{checked system.combatPower}} style="margin-left:0" />Бой Power
                                <input type="checkbox" name="system.smite" {{checked system.smite}} style="margin-left:16px;" />Кара
                            </div>
                        </div>
                        <div>
                            <label>Пассивка:</label>
                            <div style="display: flex; align-items: center">
                                <label style="margin-right:4px;">Снижение урона:</label>
                                <input type="text" name="system.passive.reduction" value="{{system.passive.reduction}}" data-dtype="Number" class="compact"/>
                            </div>
                        </div>
                        <div>
                            <label></label>
                            <div style="display: flex; align-items: center">
                                <label style="margin-right:4px;" title="Через запятую: fire, cold, lightning, acid, poison, disease, magic, holy, unholy, physical">Иммунитет:</label>
                                <input type="text" name="system.passive.immune" value="{{system.passive.immune}}" placeholder="fire, cold, ..."/>
                            </div>
                        </div>
                        <div>
                            <label></label>
                            <div style="display: flex; align-items: center">
                                <label style="margin-right:4px;">Сопротивление:</label>
                                <input type="text" name="system.passive.resistant" value="{{system.passive.resistant}}" placeholder="fire, cold, ..."/>
                            </div>
                        </div>
                        <div>
                            <label></label>
                            <div style="display: flex; align-items: center">
                                <label style="margin-right:4px;">Уязвимость:</label>
                                <input type="text" name="system.passive.vulnerable" value="{{system.passive.vulnerable}}" placeholder="fire, cold, ..."/>
                            </div>
                        </div>
                        <div>
                            <label for="guaranteedMinDamage" title="Урон, который проходит даже при промахе (напр. косы смерти) — перенесите то же число в лист связанной Атаки">Мин. урон при промахе:</label>
                            <input id="guaranteedMinDamage" name="system.guaranteedMinDamage" type="text" value="{{system.guaranteedMinDamage}}" data-dtype="Number" class="compact"/>
                        </div>
                        <div>
                            <label for="combatTag" title="Справочная метка механики боя, реализованной в системе (auto-hit / max-damage / area-attack) — включите соответствующие галочки на листе связанной Атаки, пока эффект активен">Тег механики:</label>
                            <input id="combatTag" name="system.combatTag" type="text" value="{{system.combatTag}}" placeholder="напр. auto-hit + max-damage"/>
                        </div>
                        <div>
                            <label for="saveType" title="Если задано, при использовании дара в чате появится кнопка спасброска — нажавший игрок бросает спасбросок за своего персонажа">Спасбросок цели:</label>
                            <select id="saveType" name="system.saveType">
                                {{#select system.saveType}}
                                <option value="none">Нет</option>
                                <option value="hardiness">Стойкость</option>
                                <option value="evasion">Уклонение</option>
                                <option value="spirit">Дух</option>
                                {{/select}}
                            </select>
                        </div>
                        <div>
                            <label style="vertical-align: center">Действия:</label>
                            <div class="item-controls" style="padding-top:4px;">
                                <a class="item-control item-chat" title="Эффект в чат"><i class="fas fa-comment"></i></a>
                                <a class="item-control item-maybe-delete" title="Возможно удалить"><i class="fas fa-trash"></i></a>
                                <a class="item-control item-delete" title="Удалить" style="color:red;margin-left:16px;display:none;"><i class="fas fa-trash"></i></a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
