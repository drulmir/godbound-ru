<form class="{{cssClass}}" autocomplete="off">
    {{!-- Sheet Body --}}
    <section class="sheet-body">
        <div class="tab attrs active" data-group="primary" data-tab="attrs">
            <div class="container col">
                <h2>Чудо</h2>
                <div class="container row sheet-header">
                    <img class="profile-img" src="{{item.img}}" data-edit="img" data-tooltip="{{item.name}}" height="100"
                         width="100"/>
                    <div class="header-fields tabular">
                        <div>
                            <label for="name">Имя:</label>
                            <input id="name" name="name" type="text" value="{{item.name}}"/>
                        </div>
                        <div>
                            <label for="description">Описание:</label>
                            <textarea id="description" name="system.description" class="xtall">{{system.description}}</textarea>
                        </div>
                        <div>
                            <label>Активация:</label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.instant" {{checked system.instant}} />Мгновенно
                                <input type="checkbox" name="system.onTurn" {{checked system.onTurn}} />В свой ход
                                <input type="checkbox" name="system.action" {{checked system.action}} />Действие
                            </div>
                        </div>
                        <div>
                            <label for="effortCost">Усилие:</label>
                            <input id="effortCost" name="system.effortCost" type="text" value="{{system.effortCost}}" data-dtype="Number"/>
                        </div>
                        <div>
                            <label></label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.combatPower" {{checked system.combatPower}} style="margin-left:0" />Бой Power
                                <input type="checkbox" name="system.smite" {{checked system.smite}} style="margin-left:16px;" />Кара
                            </div>
                        </div>
                        <div>
                            <label style="vertical-align: center">Действия:</label>
                            <div class="item-controls" style="padding-top:4px;">
                                <a class="item-control item-chat" data-tooltip="Эффект в чат"><i class="fas fa-comment"></i></a>
                                <a class="item-control item-maybe-delete" data-tooltip="Возможно удалить"><i class="fas fa-trash"></i></a>
                                <a class="item-control item-delete" data-tooltip="Удалить" style="color:red;margin-left:16px;display:none;"><i class="fas fa-trash"></i></a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
