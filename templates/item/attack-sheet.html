<form class="{{cssClass}}" autocomplete="off">
    {{!-- Sheet Body --}}
    <section class="sheet-body">
        <div class="tab attrs active" data-group="primary" data-tab="attrs">
            <div class="container col">
                <h2>Атака</h2>
                <div class="container row sheet-header">
                    <img class="profile-img" src="{{item.img}}" data-edit="img" data-tooltip="{{item.name}}" height="100"
                         width="100"/>
                    <div class="header-fields tabular">
                        <div>
                            <label for="name">Имя:</label>
                            <input id="name" name="name" type="text" value="{{item.name}}"/>
                        </div>
                        <div>
                            <label for="attr">Хар-ка:</label>
                            <select name="system.attr" id="attr" >
                                {{#select item.system.attr}}
                                <option value="str">Сил</option>
                                <option value="dex">Лов</option>
                                <option value="con">Тел</option>
                                <option value="int">Инт</option>
                                <option value="wis">Мдр</option>
                                <option value="cha">Хар</option>
                                {{/select}}
                            </select>
                        </div>
                        <div>
                            <label for="hitBonus">Бонус попадания:</label>
                            <input id="hitBonus" name="system.hitBonus" type="text" value="{{item.system.hitBonus}}" data-dtype="Number"/>
                        </div>
                        <div>
                            <label for="range">Дальность:</label>
                            <input id="range" name="system.range" type="text" value="{{item.system.range}}"/>
                        </div>
                        <div>
                            <label for="area">Область:</label>
                            <input id="area" name="system.area" type="text" value="{{item.system.area}}"/>
                        </div>
                        <div>
                            <label for="damageRoll">Урон:</label>
                            <div style="display: flex; align-items: center">
                                <input id="damageRoll" name="system.damageRoll" type="text" value="{{item.system.damageRoll}}" class="compactplus"/>
                                +
                                <input id="damageBonus" name="system.damageBonus" type="text" value="{{item.system.damageBonus}}" data-dtype="Number" class="compact"/>
                            </div>
                        </div>
                        <div>
                            <label></label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.magic" {{checked system.magic}} style="margin-left:0" />Магия Оружие
                            </div>
                        </div>
                        <div>
                            <label for="damageType">Тип урона:</label>
                            <select name="system.damageType" id="damageType">
                                {{#select item.system.damageType}}
                                <option value="physical">Физический</option>
                                <option value="fire">Огонь</option>
                                <option value="cold">Холод</option>
                                <option value="lightning">Молния</option>
                                <option value="acid">Кислота</option>
                                <option value="poison">Яд</option>
                                <option value="disease">Болезнь</option>
                                <option value="magic">Магия</option>
                                <option value="holy">Свет</option>
                                <option value="unholy">Тьма</option>
                                {{/select}}
                            </select>
                        </div>
                        <div>
                            <label for="guaranteedMinDamage" data-tooltip="Урон, который проходит даже при промахе (напр. косы смерти)">Мин. урон при промахе:</label>
                            <input id="guaranteedMinDamage" name="system.guaranteedMinDamage" type="text" value="{{item.system.guaranteedMinDamage}}" data-dtype="Number" class="compact"/>
                        </div>
                        <div>
                            <label data-tooltip="Временный дар/эффект (напр. 'Стрела Неодолимого Мастерства', 'Икона гнева') — включайте только пока эффект активен">Спец. режим:</label>
                            <div style="display: flex; align-items: center">
                                <input type="checkbox" name="system.autoHit" {{checked system.autoHit}} style="margin-left:0" />Авто-попадание
                                <input type="checkbox" name="system.maxDamage" {{checked system.maxDamage}} style="margin-left:16px;" />Макс. урон
                            </div>
                        </div>
                        <div>
                            <label data-tooltip="Урон применяется сразу ко всем текущим целям (Target), а не только к первой — для эффектов по площади ('Дождь Молний' и т.п.)">
                                <input type="checkbox" name="system.areaAttack" {{checked system.areaAttack}} style="margin-left:0" />Атака по площади
                            </label>
                        </div>
                        <div>
                            <label for="notes">Заметки:</label>
                            <textarea id="notes" name="system.notes" style="height:128px;font-size:14px">{{system.notes}}</textarea>
                        </div>
                        <div>
                            <label style="vertical-align: center">Действия:</label>
                            <div class="item-controls" style="padding-top:4px;">
                                <a class="item-control item-chat" data-tooltip="Эффект в чат"><i class="fas fa-comment"></i></a>
                                <a class="item-control item-maybe-delete" data-tooltip="Возможно удалить"><i class="fas fa-trash"></i></a>
                                <a class="item-control item-delete" data-tooltip="Удалить" style="color:red;margin-left:16px;display:none;"><i class="fas fa-trash"></i></a>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</form>
